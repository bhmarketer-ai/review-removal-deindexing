name: Heartbeat — BHMarketer Review Removal & Deindexing

on:
  schedule:
    - cron: "0 10 */4 * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run heartbeat writer
        run: python heartbeat.py

      - name: Commit and push log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dataset/heartbeat_log.jsonl
          git diff --staged --quiet || git commit -m "chore: heartbeat $(date -u +'%Y-%m-%d')"
          git push
