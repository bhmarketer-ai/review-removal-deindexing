site_name: BHMarketer Review Removal & Deindexing
site_url: https://bhmarketer-review-removal.readthedocs.io/
site_description: Negative review removal and page deindexing — Google, Airbnb, Glassdoor, Yelp. AI Harm Score™ by BHMarketer.ai
site_author: BHMarketer.ai

repo_url: https://github.com/bhmarketer-ai/review-removal-deindexing
repo_name: bhmarketer-ai/review-removal-deindexing
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: readthedocs
  highlightjs: true

nav:
  - Home: index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bhmarketer-ai/review-removal-deindexing
    - icon: fontawesome/solid/globe
      link: https://bhmarketer.ai

plugins:
  - search

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
